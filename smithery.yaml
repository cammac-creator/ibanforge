startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties: {}
  commandFunction:
    # A JS function that produces the CLI command to start the MCP on stdio.
    |-
    (config) => ({
      command: 'node',
      args: ['dist/mcp/server.js']
    })
