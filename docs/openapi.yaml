openapi: 3.0.3

info:
  title: IBANforge API
  version: 1.0.0
  description: |
    **IBANforge** is a production-grade IBAN validation, BIC/SWIFT lookup, and compliance screening API.

    ## Features
    - **IBAN Validation** — Validate any IBAN from 75+ countries with full BBAN parsing, check-digit verification, and formatted output.
    - **BIC/SWIFT Lookup** — Search 121K+ BIC entries sourced from GLEIF, enriched with LEI data, institution names, and branch info.
    - **Compliance Screening** — Sanctions lists (OFAC/EU/UN), FATF grey/black list status, SEPA Instant reachability, Verification of Payee (VoP) participant checks, and composite risk scoring (0–100).
    - **Issuer Classification** — Detect vIBANs by classifying issuers as traditional banks, digital banks, EMIs, or payment institutions (30+ known BIC8 mappings).
    - **SEPA Data** — SCT, SDD, and SCT_INST scheme support plus VoP requirement flags.
    - **Batch Processing** — Validate up to 100 IBANs in a single request at a discounted rate.
    - **MCP Integration** — 4 MCP tools for AI agent integration (validate_iban, batch_validate_iban, lookup_bic, compliance_check).

    ## Payment (x402 Protocol)
    Paid endpoints use the [x402 micropayment protocol](https://www.x402.org/). Include a payment token in the `X-Payment` header.
    Alternatively, use a persistent API key (`Authorization: Bearer ifk_...`) obtained via the key management endpoints.

    | Endpoint | Cost (USDC) |
    |----------|-------------|
    | POST /v1/iban/validate | $0.005 |
    | POST /v1/iban/batch | $0.002 per IBAN |
    | GET /v1/bic/{code} | $0.003 |
    | POST /v1/iban/compliance | $0.020 |

    ## Free Endpoints
    `/v1/demo`, `/health`, and `/openapi.json` are free and require no payment.
  contact:
    name: IBANforge
    url: https://ibanforge.com
    email: hello@ibanforge.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.ibanforge.com
    description: Production
  - url: http://localhost:3000
    description: Local development

tags:
  - name: IBAN
    description: IBAN validation endpoints (paid via x402 or API key)
  - name: BIC
    description: BIC/SWIFT lookup endpoints (paid via x402 or API key)
  - name: Compliance
    description: >-
      Full compliance checks — IBAN validation + sanctions screening (OFAC/EU/UN) +
      FATF status + SEPA Instant reachability + VoP + composite risk score (paid via x402 or API key)
  - name: System
    description: Health checks, statistics, and demo endpoints (free)

paths:
  /v1/iban/validate:
    post:
      operationId: validateIBAN
      summary: Validate a single IBAN
      description: |
        Validates an IBAN and returns parsed components: country, check digits, BBAN structure,
        BIC lookup, SEPA membership, issuer classification, and risk indicators.

        **Cost:** $0.005 USDC per call.
      tags:
        - IBAN
      security:
        - x402Payment: []
        - bearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - iban
              properties:
                iban:
                  type: string
                  description: IBAN to validate (spaces allowed, will be normalized)
                  example: GB29NWBK60161331926819
            example:
              iban: GB29NWBK60161331926819
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IBANValidationResult'
              example:
                iban: GB29NWBK60161331926819
                valid: true
                country:
                  code: GB
                  name: United Kingdom
                check_digits: '29'
                bban:
                  bank_code: NWBK
                  branch_code: '601613'
                  account_number: '31926819'
                bic:
                  code: NWBKGB2L
                  bank_name: NATWEST
                  city: LONDON
                sepa:
                  member: true
                  schemes:
                    - SCT
                    - SDD
                    - SCT_INST
                  vop_required: true
                issuer:
                  type: bank
                  name: NATWEST
                risk_indicators:
                  issuer_type: bank
                  country_risk: standard
                  test_bic: false
                  sepa_reachable: true
                  vop_coverage: true
                formatted: GB29 NWBK 6016 1331 9268 19
                cost_usdc: 0.005
                processing_ms: 1.23
        '400':
          description: Invalid or missing request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_json:
                  summary: Invalid JSON
                  value:
                    error: invalid_json
                    message: Request body must be valid JSON
                missing_iban:
                  summary: Missing IBAN field
                  value:
                    error: invalid_request
                    message: "Request body must include an 'iban' field (string)"
        '402':
          description: Payment required (x402 micropayment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'

  /v1/iban/batch:
    post:
      operationId: batchValidateIBAN
      summary: Validate up to 100 IBANs in one request
      description: |
        Validates a batch of IBANs and returns individual results for each, plus aggregate stats.

        **Cost:** $0.002 USDC per IBAN (e.g., 10 IBANs = $0.020, 100 IBANs = $0.200).
        This is a 60% discount compared to individual validation ($0.005 each).
      tags:
        - IBAN
      security:
        - x402Payment: []
        - bearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ibans
              properties:
                ibans:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 100
                  description: Array of IBANs to validate (1 to 100)
                  example:
                    - GB29NWBK60161331926819
                    - DE89370400440532013000
                    - FR7630006000011234567890189
            example:
              ibans:
                - GB29NWBK60161331926819
                - DE89370400440532013000
      responses:
        '200':
          description: Batch validation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchValidationResponse'
              example:
                results:
                  - iban: GB29NWBK60161331926819
                    valid: true
                    country:
                      code: GB
                      name: United Kingdom
                    cost_usdc: 0.002
                  - iban: DE89370400440532013000
                    valid: true
                    country:
                      code: DE
                      name: Germany
                    cost_usdc: 0.002
                count: 2
                valid_count: 2
                cost_usdc: 0.004
                processing_ms: 2.15
        '400':
          description: Invalid or missing request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_json:
                  summary: Invalid JSON
                  value:
                    error: invalid_json
                    message: Request body must be valid JSON
                missing_ibans:
                  summary: Missing ibans array
                  value:
                    error: invalid_request
                    message: "Request body must include an 'ibans' array of strings (1-100 items)"
                empty_batch:
                  summary: Empty batch
                  value:
                    error: empty_batch
                    message: At least 1 IBAN is required
                too_large:
                  summary: Batch too large
                  value:
                    error: batch_too_large
                    message: Maximum 100 IBANs per batch request
        '402':
          description: Payment required (x402 micropayment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'

  /v1/bic/{code}:
    get:
      operationId: lookupBIC
      summary: Lookup a BIC/SWIFT code
      description: |
        Returns institution details for a BIC/SWIFT code (8 or 11 characters).
        Data sourced from GLEIF with 121K+ entries, enriched with LEI identifiers.

        **Cost:** $0.003 USDC per call.
      tags:
        - BIC
      security:
        - x402Payment: []
        - bearerApiKey: []
      parameters:
        - name: code
          in: path
          required: true
          description: BIC/SWIFT code (8 or 11 alphanumeric characters)
          schema:
            type: string
            pattern: '^[A-Za-z0-9]{8}([A-Za-z0-9]{3})?$'
            minLength: 8
            maxLength: 11
          examples:
            bic8:
              summary: 8-character BIC
              value: UBSWCHZH
            bic11:
              summary: 11-character BIC
              value: UBSWCHZHXXX
      responses:
        '200':
          description: BIC lookup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BICLookupResult'
              example:
                bic: UBSWCHZH
                bic8: UBSWCHZH
                bic11: UBSWCHZHXXX
                found: true
                valid_format: true
                institution: UBS AG
                country:
                  code: CH
                  name: Switzerland
                city: ZURICH
                branch_code: XXX
                branch_info: null
                lei: 529900WSQHJNUM4L2346
                lei_status: ISSUED
                is_test_bic: false
                source: GLEIF
                cost_usdc: 0.003
                processing_ms: 0.45
        '400':
          description: Invalid BIC format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid_bic_format
                message: BIC code must be 8 or 11 alphanumeric characters
        '402':
          description: Payment required (x402 micropayment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'

  /v1/iban/compliance:
    post:
      operationId: complianceCheck
      summary: Full IBAN compliance check
      description: |
        Validates an IBAN and returns everything from `/v1/iban/validate` **plus** a full compliance layer:
        - **Sanctions screening** — OFAC, EU, and UN sanctions lists
        - **FATF status** — Member, grey list, or black list classification
        - **SEPA Instant reachability** — SCT, SDD, and SCT_INST scheme participation
        - **Verification of Payee (VoP)** — Participant status check
        - **Composite risk score** — 0 to 100 with risk level (low/medium/elevated/high/critical)
        - **Risk flags** — Specific flags like `sanctioned_country`, `fatf_grey_list`, `emi_issuer`, `no_vop`

        **Cost:** $0.020 USDC per call.
      tags:
        - Compliance
      security:
        - x402Payment: []
        - bearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - iban
              properties:
                iban:
                  type: string
                  description: IBAN to check
                  example: DE89370400440532013000
            example:
              iban: DE89370400440532013000
      responses:
        '200':
          description: Compliance check result (includes full IBAN validation + compliance layer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceCheckResponse'
              example:
                iban: DE89370400440532013000
                valid: true
                country:
                  code: DE
                  name: Germany
                check_digits: '89'
                bban:
                  bank_code: '37040044'
                  account_number: '0532013000'
                bic:
                  code: COBADEFFXXX
                  bank_name: COMMERZBANK AG
                  city: FRANKFURT AM MAIN
                sepa:
                  member: true
                  schemes:
                    - SCT
                    - SDD
                    - SCT_INST
                  vop_required: true
                issuer:
                  type: bank
                  name: COMMERZBANK AG
                risk_indicators:
                  issuer_type: bank
                  country_risk: standard
                  test_bic: false
                  sepa_reachable: true
                  vop_coverage: true
                compliance:
                  sanctions:
                    country_sanctioned: false
                    bank_sanctioned: false
                    matched_lists: []
                    fatf_status: member
                  reachability:
                    sepa_instant: true
                    sct: true
                    sdd: true
                  vop:
                    participant: true
                    status: active
                  risk_score: 0
                  risk_level: low
                  flags: []
                formatted: DE89 3704 0044 0532 0130 00
                cost_usdc: 0.02
                processing_ms: 3.47
        '400':
          description: Invalid or missing request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid_request
                message: "Request body must include an 'iban' field (string)"
        '402':
          description: Payment required (x402 micropayment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'

  /v1/demo:
    get:
      operationId: getDemo
      summary: Free demo results
      description: |
        Returns example IBAN validations, BIC lookups, and a compliance check demo.
        No payment required. Use this to explore the API response format before integrating.
      tags:
        - System
      responses:
        '200':
          description: Demo results with IBAN, BIC, and compliance examples
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoResponse'

  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: |
        Returns API health status, version, uptime, and BIC database stats.
        No payment required. Suitable for uptime monitoring.
      tags:
        - System
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: 1.0.0
                uptime_seconds: 86400
                bic_database_entries: 121197
                bic_data_last_updated: '2025-01-15T00:00:00Z'
        '503':
          description: Service unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: health_check_failed

  /stats:
    get:
      operationId: getStats
      summary: API usage statistics
      description: |
        Returns detailed API usage statistics broken down by operation type,
        top countries, revenue, and recent daily history.
        Requires authentication via `Authorization: Bearer <STATS_TOKEN>`.
      tags:
        - System
      security:
        - statsToken: []
      responses:
        '200':
          description: Statistics overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsOverview'
        '403':
          description: Unauthorized — missing or invalid stats token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: unauthorized
                message: Stats require authentication.

  /stats/history:
    get:
      operationId: getStatsHistory
      summary: Historical daily statistics
      description: Returns per-day statistics for the requested period (1 to 90 days).
      tags:
        - System
      security:
        - statsToken: []
      parameters:
        - name: period
          in: query
          required: false
          description: Number of days to retrieve (1-90, default 7)
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
      responses:
        '200':
          description: Array of daily stats
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - date
                    - total
                    - revenue
                  properties:
                    date:
                      type: string
                      format: date
                    total:
                      type: integer
                    revenue:
                      type: number
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stats/hourly:
    get:
      operationId: getStatsHourly
      summary: Hourly traffic heatmap
      description: Returns hourly traffic distribution for heatmap visualization.
      tags:
        - System
      security:
        - statsToken: []
      parameters:
        - name: period
          in: query
          required: false
          description: Number of days to aggregate (1-90, default 7)
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
      responses:
        '200':
          description: Hourly heatmap data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HourlyStatsResponse'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stats/errors:
    get:
      operationId: getStatsErrors
      summary: Error analytics
      description: Returns error rates, top invalid IBANs, top missing BICs, and errors by country.
      tags:
        - System
      security:
        - statsToken: []
      parameters:
        - name: period
          in: query
          required: false
          description: Number of days to aggregate (1-90, default 30)
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        '200':
          description: Error statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatsResponse'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stats/patterns:
    get:
      operationId: getStatsPatterns
      summary: Usage pattern analytics
      description: Returns endpoint share trends and geographic distribution over time.
      tags:
        - System
      security:
        - statsToken: []
      parameters:
        - name: period
          in: query
          required: false
          description: Number of days to aggregate (1-90, default 30)
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        '200':
          description: Pattern statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatternStatsResponse'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    x402Payment:
      type: apiKey
      in: header
      name: X-Payment
      description: >-
        x402 USDC micropayment token. Obtain a payment token from the x402 facilitator
        and include it in this header for paid endpoints.
    bearerApiKey:
      type: http
      scheme: bearer
      description: >-
        Persistent API key (format: ifk_...). Obtain via POST /v1/api-keys.
        Include as Authorization: Bearer ifk_...
    statsToken:
      type: http
      scheme: bearer
      description: >-
        Stats dashboard token (STATS_TOKEN environment variable).
        Required only for /stats endpoints.

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Machine-readable error code
          example: invalid_request
        message:
          type: string
          description: Human-readable error message
          example: "Request body must include an 'iban' field (string)"

    PaymentRequired:
      type: object
      properties:
        error:
          type: string
          example: payment_required
        message:
          type: string
          example: 'This endpoint requires payment via x402. Include an X-Payment header.'
        price_usdc:
          type: number
          example: 0.005
        facilitator_url:
          type: string
          example: https://facilitator.x402.org

    IBANValidationResult:
      type: object
      required:
        - iban
        - valid
        - cost_usdc
      properties:
        iban:
          type: string
          description: The IBAN as provided (normalized, uppercase, no spaces)
          example: GB29NWBK60161331926819
        valid:
          type: boolean
          description: Whether the IBAN passes all validation checks
          example: true
        country:
          type: object
          description: Country information derived from the IBAN prefix
          properties:
            code:
              type: string
              description: ISO 3166-1 alpha-2 country code
              example: GB
            name:
              type: string
              description: Full country name (localized via Intl.DisplayNames)
              example: United Kingdom
          required:
            - code
            - name
        check_digits:
          type: string
          description: IBAN check digits (positions 3-4)
          example: '29'
        bban:
          type: object
          description: Parsed BBAN (Basic Bank Account Number) components
          properties:
            bank_code:
              type: string
              description: Bank/institution code
              example: NWBK
            branch_code:
              type: string
              description: Branch/sort code (not present for all countries)
              example: '601613'
            account_number:
              type: string
              description: Account number
              example: '31926819'
          required:
            - bank_code
            - account_number
        bic:
          type: object
          nullable: true
          description: BIC/SWIFT code resolved from the bank code (null if not found)
          properties:
            code:
              type: string
              description: Full BIC code
              example: NWBKGB2L
            bank_name:
              type: string
              nullable: true
              description: Institution name from GLEIF database
              example: NATWEST
            city:
              type: string
              nullable: true
              description: City of the institution
              example: LONDON
          required:
            - code
            - bank_name
            - city
        sepa:
          type: object
          description: SEPA compliance details (only present for valid IBANs in SEPA countries)
          properties:
            member:
              type: boolean
              description: Whether the country is a SEPA member
              example: true
            schemes:
              type: array
              description: 'Supported SEPA schemes: SCT (Credit Transfer), SDD (Direct Debit), SCT_INST (Instant)'
              items:
                type: string
                enum:
                  - SCT
                  - SDD
                  - SCT_INST
              example:
                - SCT
                - SDD
                - SCT_INST
            vop_required:
              type: boolean
              description: Whether Verification of Payee is required under EU Instant Payments Regulation
              example: true
          required:
            - member
            - schemes
            - vop_required
        issuer:
          type: object
          description: >-
            Issuer classification (only present when BIC is resolved).
            Useful for vIBAN detection and KYC enrichment.
          properties:
            type:
              type: string
              enum:
                - bank
                - digital_bank
                - emi
                - payment_institution
              description: >-
                Type of financial institution (bank = traditional, digital_bank = neobank/challenger,
                emi = Electronic Money Institution, payment_institution = licensed PI)
              example: bank
            name:
              type: string
              description: Name of the issuing institution
              example: NATWEST
          required:
            - type
            - name
        risk_indicators:
          type: object
          description: >-
            AML/CFT risk indicators for compliance pre-screening.
            Only present when the IBAN is valid.
          properties:
            issuer_type:
              type: string
              enum:
                - bank
                - digital_bank
                - emi
                - payment_institution
              description: Type of the issuing institution (mirrors issuer.type)
              example: bank
            country_risk:
              type: string
              enum:
                - standard
                - elevated
                - high
              description: Country risk based on FATF grey/black lists and EU high-risk third countries
              example: standard
            test_bic:
              type: boolean
              description: Whether the BIC is a test/sandbox code (position 8 = 0)
              example: false
            sepa_reachable:
              type: boolean
              description: Whether the IBAN can receive SEPA Credit Transfers
              example: true
            vop_coverage:
              type: boolean
              description: Whether the institution participates in Verification of Payee
              example: true
          required:
            - issuer_type
            - country_risk
            - test_bic
            - sepa_reachable
            - vop_coverage
        formatted:
          type: string
          description: IBAN formatted in groups of 4 characters for display
          example: GB29 NWBK 6016 1331 9268 19
        error:
          type: string
          description: Error code when IBAN is invalid
          enum:
            - invalid_format
            - unsupported_country
            - wrong_length
            - checksum_failed
        error_detail:
          type: string
          description: Additional details about the validation error
        cost_usdc:
          type: number
          description: Cost of this operation in USDC
          example: 0.005
        processing_ms:
          type: number
          description: Server-side processing time in milliseconds
          example: 1.23

    BatchValidationResponse:
      type: object
      required:
        - results
        - count
        - valid_count
        - cost_usdc
        - processing_ms
      properties:
        results:
          type: array
          description: Individual validation results for each IBAN
          items:
            $ref: '#/components/schemas/IBANValidationResult'
        count:
          type: integer
          description: Total number of IBANs processed
          example: 10
        valid_count:
          type: integer
          description: Number of valid IBANs in the batch
          example: 8
        cost_usdc:
          type: number
          description: Total cost of the batch in USDC ($0.002 per IBAN)
          example: 0.02
        processing_ms:
          type: number
          description: Total server-side processing time in milliseconds
          example: 5.67

    BICLookupResult:
      type: object
      required:
        - bic
        - bic8
        - bic11
        - found
        - valid_format
        - institution
        - country
        - city
        - branch_code
        - branch_info
        - lei
        - lei_status
        - is_test_bic
        - source
        - cost_usdc
      properties:
        bic:
          type: string
          description: BIC as provided (normalized to uppercase)
          example: UBSWCHZH
        bic8:
          type: string
          description: 8-character BIC (institution + country + location)
          example: UBSWCHZH
        bic11:
          type: string
          description: 11-character BIC with branch code (XXX = head office)
          example: UBSWCHZHXXX
        found:
          type: boolean
          description: Whether the BIC was found in the GLEIF database
          example: true
        valid_format:
          type: boolean
          description: Whether the BIC format is valid per ISO 9362
          example: true
        institution:
          type: string
          nullable: true
          description: Institution/bank name
          example: UBS AG
        country:
          type: object
          required:
            - code
            - name
          properties:
            code:
              type: string
              description: ISO 3166-1 alpha-2 country code
              example: CH
            name:
              type: string
              description: Full country name
              example: Switzerland
        city:
          type: string
          nullable: true
          description: City of the institution
          example: ZURICH
        branch_code:
          type: string
          description: Branch code (last 3 characters of BIC11, XXX = head office)
          example: XXX
        branch_info:
          type: string
          nullable: true
          description: Branch description if available
        lei:
          type: string
          nullable: true
          description: Legal Entity Identifier (20-character LEI code from GLEIF)
          example: 529900WSQHJNUM4L2346
        lei_status:
          type: string
          nullable: true
          description: LEI registration status
          example: ISSUED
        is_test_bic:
          type: boolean
          description: Whether this is a test/sandbox BIC (position 8 = 0)
          example: false
        source:
          type: string
          nullable: true
          description: Data source for this entry
          example: GLEIF
        note:
          type: string
          description: >-
            Additional note (e.g., when BIC format is valid but not found in the database)
        cost_usdc:
          type: number
          description: Cost of this operation in USDC
          example: 0.003
        processing_ms:
          type: number
          description: Server-side processing time in milliseconds
          example: 0.45

    ComplianceResult:
      type: object
      required:
        - sanctions
        - reachability
        - vop
        - risk_score
        - risk_level
        - flags
      properties:
        sanctions:
          type: object
          description: Sanctions screening results
          required:
            - country_sanctioned
            - bank_sanctioned
            - matched_lists
            - fatf_status
          properties:
            country_sanctioned:
              type: boolean
              description: Whether the IBAN country is under sanctions
              example: false
            bank_sanctioned:
              type: boolean
              description: Whether the specific bank/BIC is sanctioned
              example: false
            matched_lists:
              type: array
              description: List of sanctions lists that matched (e.g., OFAC_SDN, EU_SANCTIONS)
              items:
                type: string
              example: []
            fatf_status:
              type: string
              description: FATF membership status of the country
              enum:
                - member
                - grey_list
                - black_list
                - non_member
              example: member
        reachability:
          type: object
          description: SEPA scheme participation of the institution
          required:
            - sepa_instant
            - sct
            - sdd
          properties:
            sepa_instant:
              type: boolean
              description: Whether the bank supports SEPA Instant Credit Transfer (SCT_INST)
              example: true
            sct:
              type: boolean
              description: Whether the bank is a SEPA Credit Transfer participant
              example: true
            sdd:
              type: boolean
              description: Whether the bank is a SEPA Direct Debit participant
              example: true
        vop:
          type: object
          description: Verification of Payee participation status
          required:
            - participant
            - status
          properties:
            participant:
              type: boolean
              description: Whether the bank participates in Verification of Payee
              example: true
            status:
              type: string
              description: Current VoP participation status
              enum:
                - active
                - pending
                - inactive
                - not_found
              example: active
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Composite risk score (0 = no risk, 100 = critical).
            Factors: sanctions, FATF status, issuer type, country risk, SEPA reachability, VoP coverage.
          example: 0
        risk_level:
          type: string
          description: Human-readable risk level derived from risk_score
          enum:
            - low
            - medium
            - elevated
            - high
            - critical
          example: low
        flags:
          type: array
          description: >-
            Specific risk flags detected. Possible values: sanctioned_country, sanctioned_bank,
            fatf_black_list, fatf_grey_list, fatf_non_member, payment_institution_issuer,
            emi_issuer, high_risk_country, elevated_risk_country, test_bic, no_sepa_instant, no_vop.
          items:
            type: string
          example: []

    ComplianceCheckResponse:
      description: >-
        Full compliance check response — combines IBAN validation result with compliance layer.
      allOf:
        - $ref: '#/components/schemas/IBANValidationResult'
        - type: object
          required:
            - compliance
          properties:
            compliance:
              $ref: '#/components/schemas/ComplianceResult'

    DemoResponse:
      type: object
      properties:
        message:
          type: string
          description: Welcome message with endpoint references
          example: >-
            Demo -- these results are free. Use POST /v1/iban/validate, POST /v1/iban/batch,
            GET /v1/bic/:code, or POST /v1/iban/compliance for your own queries.
        iban_examples:
          type: array
          description: Example IBAN validation results
          items:
            allOf:
              - type: object
                properties:
                  label:
                    type: string
                    example: 'UK -- NatWest'
              - $ref: '#/components/schemas/IBANValidationResult'
        bic_examples:
          type: array
          description: Example BIC lookup results
          items:
            type: object
            properties:
              label:
                type: string
                example: 'UBS -- Switzerland'
              bic:
                type: string
                example: UBSWCHZH
              bic8:
                type: string
              bic11:
                type: string
              found:
                type: boolean
              institution:
                type: string
                nullable: true
              country:
                type: object
                properties:
                  code:
                    type: string
                  name:
                    type: string
                    nullable: true
              city:
                type: string
                nullable: true
              lei:
                type: string
                nullable: true
              cost_usdc:
                type: number
        compliance_example:
          type: object
          description: Example compliance check result
          properties:
            description:
              type: string
            endpoint:
              type: string
            cost:
              type: string
            result:
              $ref: '#/components/schemas/ComplianceCheckResponse'

