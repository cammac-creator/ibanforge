# Runtime test harness for the IBANforge Bank Auto-fill Odoo 18 module.
#
#   docker compose -f docker-compose.test.yml up -d db
#   docker compose -f docker-compose.test.yml run --rm odoo \
#     odoo -d testdb -i ibanforge_bank_autofill \
#     --test-enable --test-tags /ibanforge_bank_autofill \
#     --stop-after-init --without-demo=all --log-level=test
#
# The module's tests mock requests.post, so this needs NO network and NO API key.
# This file lives in integrations/odoo/, so ./ mounts that dir (which contains
# ibanforge_bank_autofill/) as Odoo's extra-addons path.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U odoo']
      interval: 3s
      timeout: 3s
      retries: 20

  odoo:
    image: odoo:18
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./:/mnt/extra-addons
    ports:
      - '8069:8069'
