name: Refresh the Italian bank-code registers (Banca d'Italia)

# Pourquoi une relecture à part, chaque semaine
#
# L'Italie est un registre PARTIEL : un code en vigueur nomme son titulaire, un
# code radié répond `retired` avec sa date et son successeur légal, une absence
# ne dit rien. Un registre en retard ne peut donc produire aucun refus ; il
# garde seulement, jusqu'à la relecture suivante, la réponse d'avant pour un
# code tout juste créé ou radié. La Banca d'Italia met à jour la liste des
# intermédiaires chaque jour et celle des fusions chaque semaine (catalogue DCAT
# de la Banca d'Italia) ; mesuré de juin à septembre 2026, le contenu qui compte
# pour les IBAN change quelques fois par mois. Une relecture hebdomadaire suit
# donc la source sans redéployer l'API pour rien : elle ne commite que si le
# CONTENU italien a changé.
#
# Le jeudi : l'édition du mercredi soir (les fichiers lus le 25/09/2026 étaient
# datés du mercredi 23/09, 22 h 34 et 22 h 45) est alors publiée.
#
# Ce que ce run peut toucher : les lignes italiennes de data/bic.sqlite et
# frontend/data/registers/it-bank.json, rien d'autre. Seul le chargeur italien
# tourne (`seed-national.ts IT` ne télécharge que chez bancaditalia.it), et
# scripts/it-register-diff.ts refuse le commit si une autre table, un autre pays
# ou le schéma diffère de la base commitée. Le rafraîchissement mensuel
# (refresh-bic.yml) ne lit PAS l'Italie : il ne dépend pas de bancaditalia.it.
#
# Licence : open data CC BY 4.0 de la Banca d'Italia ; le crédit voyage dans les
# lignes elles-mêmes, et les journaux (publics, comme le dépôt) ne portent que
# l'édition, les décomptes et des adresses publiques.
#
# L'Italie est publique, hors de la famille sous conditions
# (src/lib/restricted-family.ts) : le seeder tourne sans SEED_FAMILY, donc sur les
# sources publiques seules, et la suite (src/lib/public-base-family-free.test.ts)
# refuse une base qui porterait une ligne de cette famille avant tout commit.
# L'export des pages italiennes ne porte aucun champ tiré des registres EPC.
#
# Trois jobs, depuis l'audit du 10.11.2026 (OPS-20), comme
# refresh-cz-register.yml qui en donne la raison : refresh-it fait tout le
# travail npm avec un jeton en lecture seule, installé sans scripts, et remet
# les fichiers à commiter dans un artefact ; publish, le seul job qui peut
# écrire, ne lance aucun code de dépendance : il refuse tout chemin inattendu,
# commite et pousse ; report envoie le battement après la poussée, et les
# alertes. scripts/workflow-hardening.test.ts refuse tout retour en arrière.

on:
  schedule:
    # Chaque jeudi à 05:37 UTC (07:37 à Rome en été, 06:37 en hiver).
    - cron: '37 5 * * 4'
  workflow_dispatch:

# Chaque job déclare ses propres droits, plus bas.
permissions:
  contents: read

# Le même groupe que refresh-bic.yml et refresh-cz-register.yml : un seul
# écrivain de data/bic.sqlite à la fois. Le jeudi, la relecture tchèque de
# 05:17 et celle-ci font la queue au lieu de se disputer le même binaire ;
# aucune n'annule l'autre.
concurrency:
  group: bic-sqlite-writer
  cancel-in-progress: false

# Ce que ce run peut commiter, et rien d'autre : le job de travail le remet, le
# job d'écriture refuse tout autre chemin. La même liste que le `git add`.
env:
  COMMITTED_PATHS: 'data/bic.sqlite frontend/data/registers/it-bank.json'

jobs:
  # 1. Le travail, en lecture seule.
  refresh-it:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff_it.outputs.changed }}
      it_register: ${{ steps.seed_it.outputs.it_register }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Sans scripts d'installation, comme le Dockerfile de production :
      # better-sqlite3 charge son binaire précompilé (prebuilds/), et tsx trouve
      # celui d'esbuild dans son paquet de plateforme.
      - run: npm ci --ignore-scripts

      # Sort en 0 quand bancaditalia.it ne répond pas, répond une page à la
      # place du fichier ou sert une édition plus ancienne que celle déjà
      # chargée : les tables restent, et la sortie `it_register=not_loaded`
      # sonne l'alarme en fin de run. Un changement de FORMAT fait échouer
      # l'étape, pour qu'un humain le lise.
      - name: Read the Italian registers (bancaditalia.it only)
        id: seed_it
        run: npx tsx scripts/seed-national.ts IT

      # Les lignes italiennes seulement, comparées par contenu à la base
      # commitée. Refuse (étape rouge, alerte) si autre chose diffère ; écrit
      # `changed=true|false` sinon.
      - name: Italian rows only, and did they change?
        id: diff_it
        run: npx tsx scripts/it-register-diff.ts

      # Le même garde de qualité que le rafraîchissement mensuel, sur le
      # changement italien : un registre effondré serait refusé ici, avant tout
      # commit.
      - name: Quality diff against the committed database
        if: steps.diff_it.outputs.changed == 'true'
        run: npx tsx scripts/refresh-diff.ts

      - name: Run tests
        if: steps.diff_it.outputs.changed == 'true'
        run: npm run test

      # Les pages /it lisent un JSON exporté de cette base par l'API elle-même :
      # réexporté dans le même commit, sans toucher aux fichiers des autres
      # registres (le filtre du script n'écrit que it-bank.json).
      - name: Export the Italian register pages
        if: steps.diff_it.outputs.changed == 'true'
        run: npm run pages:export -- IT

      # Remettre au job d'écriture les fichiers à commiter, sous leur chemin
      # dans le dépôt.
      - name: Hand the files over to the publish job
        id: handoff
        if: steps.diff_it.outputs.changed == 'true'
        run: |
          read -r -a paths <<< "$COMMITTED_PATHS"
          for p in "${paths[@]}"; do
            mkdir -p "$RUNNER_TEMP/robot-files/$(dirname "$p")"
            cp -R "$p" "$RUNNER_TEMP/robot-files/$p"
          done

      - uses: actions/upload-artifact@v7
        if: steps.handoff.outcome == 'success'
        with:
          name: robot-files
          path: ${{ runner.temp }}/robot-files/
          if-no-files-found: error
          retention-days: 1

  # 2. L'écriture, sans code de dépendance : ni npm, ni npx, ni node, ni tsx.
  publish:
    needs: refresh-it
    if: needs.refresh-it.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: robot-files
          path: ${{ runner.temp }}/robot-files

      # Exactement les chemins attendus : un chemin de plus, un chemin absent ou
      # autre chose qu'un fichier ordinaire, et rien n'est commité. Mieux vaut
      # une alerte qu'un commit partiel.
      - name: Only the expected files, nothing else
        env:
          ARTEFACT: ${{ runner.temp }}/robot-files
        run: |
          set -euo pipefail
          read -r -a paths <<< "$COMMITTED_PATHS"
          inside() {
            local f=$1 p
            for p in "${paths[@]}"; do
              [ "$f" = "$p" ] && return 0
              case "$f" in "$p"/*) return 0 ;; esac
            done
            return 1
          }
          refuse() {
            echo "::error title=Artefact refusé::$1 ; rien n'est commité."
            exit 1
          }
          # Des fichiers ordinaires seulement : un lien pourrait viser .git/.
          odd=$(find "$ARTEFACT" ! -type f ! -type d)
          [ -z "$odd" ] || refuse "autre chose qu'un fichier ordinaire : $odd"
          files=$(cd "$ARTEFACT" && find . -type f | sed 's|^\./||' | LC_ALL=C sort)
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            inside "$f" || refuse "chemin inattendu : $f"
          done <<< "$files"
          for p in "${paths[@]}"; do
            [ -f "$ARTEFACT/$p" ] && continue
            [ -d "$ARTEFACT/$p" ] && [ -n "$(find "$ARTEFACT/$p" -type f)" ] && continue
            refuse "chemin attendu absent : $p"
          done
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            mkdir -p "$(dirname "$f")"
            cp "$ARTEFACT/$f" "$f"
          done <<< "$files"
          # Le dépôt n'a bougé que sous ces chemins.
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            inside "${line:3}" || refuse "le dépôt a bougé ailleurs : ${line:3}"
          done <<< "$(git status --porcelain --untracked-files=all)"
          echo "Artefact conforme :"
          printf '%s\n' "$files"

      - name: Commit the Italian registers
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Le jeton n'existe que dans l'environnement de cette étape, le temps
          # du pull et de la poussée : ni dans .git/config, ni dans une adresse.
          basic=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$basic"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bic.sqlite frontend/data/registers/it-bank.json
          git commit -m "chore(data): registres italiens de la Banca d'Italia, nouvelle édition (relecture hebdomadaire)"
          git pull --rebase
          git push

  # 3. Après la poussée : le battement, l'alarme italienne et l'alerte.
  report:
    needs: [refresh-it, publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Lire les jobs du run, pour que l'alerte nomme l'étape qui a cassé.
      actions: read

    steps:
      # Homme mort : dire à l'API que ce cron est passé (src/lib/ops-alert.ts,
      # HEARTBEATS). APRÈS la poussée depuis l'audit du 10.11.2026 (OPS-33),
      # comme refresh-bic.yml depuis OPS-03 : un push rejeté ne doit pas
      # laisser le battement pointé. La poussée redémarre l'API sur Railway,
      # d'où dix tentatives à 30 s (environ 5 minutes) ; une semaine sans
      # nouvelle édition ne pousse rien et pointe tout de suite. Bloquant :
      # au-delà, l'API ne répond pas, et l'alerte le dit. Il ne part que si la
      # relecture a réussi et que la poussée a réussi ou n'avait rien à faire.
      - name: Heartbeat (après le push)
        id: heartbeat
        if: ${{ !cancelled() && needs.refresh-it.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
        env:
          HEARTBEAT_TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}
        run: |
          if [ -z "$HEARTBEAT_TOKEN" ]; then
            echo "::warning::HEARTBEAT_TOKEN absent, battement non envoyé"
            exit 0
          fi
          for i in $(seq 1 10); do
            curl -fsS -X POST \
              -H "x-heartbeat-token: $HEARTBEAT_TOKEN" \
              "https://api.ibanforge.com/internal/heartbeat/refresh-it-register" && exit 0
            echo "tentative $i/10 sans réponse, l'API redémarre peut-être après le push"
            sleep 30
          done
          echo "::error::battement KO après 10 tentatives sur environ 5 minutes, l'API ne répond pas"
          exit 1

      - name: Italian registers not loaded (bancaditalia.it)
        if: ${{ !cancelled() && steps.heartbeat.outcome == 'success' && needs.refresh-it.outputs.it_register == 'not_loaded' }}
        run: |
          echo "::error title=Italian registers not loaded::the Banca d'Italia registers could not be re-read this week; the Italian edition already loaded is still served"
          exit 1

      # La même alerte que refresh-bic.yml et refresh-cz-register.yml, mêmes
      # secrets. Elle lit les étapes en échec de tous les jobs du run, donc
      # parle aussi pour les deux jobs ci-dessus.
      - name: Tell Telegram if anything above failed
        if: ${{ !cancelled() && (failure() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::secrets Telegram absents, alerte non envoyée"
            exit 0
          fi
          STEP=""
          if RAW=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
                     --jq '.jobs[].steps[] | select(.conclusion=="failure") | .name' 2>/dev/null); then
            STEP=$(printf '%s' "$RAW" | head -3 | paste -sd, -)
          fi
          [ -z "$STEP" ] && STEP="(étape inconnue, voir le run)"
          CONSEQ="les registres italiens (Banca d’Italia) n’ont pas été relus ; l’édition déjà chargée reste servie."
          case "$STEP" in
            "Italian rows only"*) CONSEQ="la relecture a changé autre chose que les lignes italiennes : rien n’a été commité." ;;
            "Only the expected files"*) CONSEQ="l’artefact de la relecture ne portait pas exactement les fichiers attendus : rien n’a été commité. Lire le journal du job publish." ;;
            *Heartbeat*) CONSEQ="les registres italiens ont bien été relus (et poussés s’ils avaient changé), mais l’API n’a pas répondu au battement en 5 minutes : vérifier que le service est debout." ;;
          esac
          MSG=$(printf '%s\nÉtape : %s\nConséquence : %s\n%s' \
                  "🔴 IBANforge : le workflow « ${GITHUB_WORKFLOW} » a ÉCHOUÉ" "$STEP" "$CONSEQ" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" >/dev/null
