name: Release & republish

# Triggered on every git tag matching v*.*.* (or manually via workflow_dispatch
# with a `version` input). Auto-publishes the registries that allow token/OIDC
# automation: PyPI (PYPI_TOKEN) and the MCP Registry (GitHub Actions OIDC).
#
# npm is HYBRID: npm's 2026 "2FA approval gate" (staged publishing) requires a
# live interactive 2FA challenge that no automation token can satisfy, so the two
# npm steps are best-effort and the maintainer publishes them by hand with
# Touch ID (see RELEASING.md). The MCP Registry validates that the npm package
# version exists, so the correct order is: npm (manual) FIRST, then re-run this
# workflow so the MCP Registry step succeeds.
#
# Platforms without a publish API (Smithery, MCP.so, RapidAPI, DevHunt, Glama)
# need a manual refresh — the job ends with a checklist in the run summary.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without v prefix, e.g. 1.2.0)'
        required: true

permissions:
  contents: write
  # Required for the MCP Registry publish, which authenticates via GitHub
  # Actions OIDC for the io.github.cammac-creator/* namespace — no stored token.
  id-token: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      # ─── npm — ibanforge-mcp + @ibanforge/sdk ────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # npm publish is best-effort in CI: npm's 2FA approval gate (staged
      # publishing) requires a live interactive 2FA challenge that no token can
      # satisfy, so a CI publish fails with EOTP by design. We attempt it (in
      # case the gate is ever lifted), but never fail the whole release on it —
      # PyPI + the MCP Registry publish fine automatically. When npm is skipped
      # this way, publish the two packages manually with Touch ID:
      #   cd mcp && npm publish --access public
      #   cd sdks/typescript && npm run build && npm publish --access public
      - name: Publish ibanforge-mcp (best-effort — manual fallback on 2FA gate)
        if: hashFiles('mcp/package.json') != ''
        continue-on-error: true # never let an npm hiccup (incl. npm ci) block the PyPI/MCP steps
        working-directory: mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN not set — skipping ibanforge-mcp publish"
            exit 0
          fi
          PUBLISHED=$(npm view ibanforge-mcp@${{ steps.ver.outputs.version }} version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "${{ steps.ver.outputs.version }}" ]; then
            echo "ibanforge-mcp@${{ steps.ver.outputs.version }} already on npm — skipping"
            exit 0
          fi
          npm ci
          npm run build
          if npm publish --access public; then
            echo "ibanforge-mcp@${{ steps.ver.outputs.version }} published to npm"
          else
            echo "::warning::npm publish of ibanforge-mcp failed (likely the 2FA approval gate). Publish manually: cd mcp && npm publish --access public"
          fi

      - name: Publish @ibanforge/sdk (best-effort — manual fallback on 2FA gate)
        if: hashFiles('sdks/typescript/package.json') != ''
        continue-on-error: true # never let an npm hiccup (incl. npm ci) block the PyPI/MCP steps
        working-directory: sdks/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN not set — skipping @ibanforge/sdk publish"
            exit 0
          fi
          PUBLISHED=$(npm view @ibanforge/sdk@${{ steps.ver.outputs.version }} version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "${{ steps.ver.outputs.version }}" ]; then
            echo "@ibanforge/sdk@${{ steps.ver.outputs.version }} already on npm — skipping"
            exit 0
          fi
          npm ci
          npm run build || true
          if npm publish --access public; then
            echo "@ibanforge/sdk@${{ steps.ver.outputs.version }} published to npm"
          else
            echo "::warning::npm publish of @ibanforge/sdk failed (likely the 2FA approval gate). Publish manually: cd sdks/typescript && npm run build && npm publish --access public"
          fi

      # ─── PyPI — ibanforge ────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish ibanforge (Python)
        if: hashFiles('sdks/python/pyproject.toml') != ''
        working-directory: sdks/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::warning::PYPI_TOKEN not set — skipping ibanforge PyPI publish"
            exit 0
          fi
          # Skip if version already on PyPI
          PUBLISHED=$(curl -s "https://pypi.org/pypi/ibanforge/json" | python3 -c "import sys,json; print(json.load(sys.stdin).get('info',{}).get('version','?'))" 2>/dev/null || echo "?")
          # The Python SDK uses its own version (1.1.x is fine when the repo is on 1.2.0).
          # We still build + upload, twine errors on duplicates so this is idempotent.
          pip install --quiet build twine
          rm -rf dist/ build/
          python -m build
          twine check dist/*
          twine upload dist/* --skip-existing

      # ─── MCP Registry — io.github.cammac-creator/ibanforge ──────────────
      # Authenticates via GitHub Actions OIDC (no stored secret): the runner
      # mints an OIDC token the registry validates against the io.github.<owner>
      # namespace, confirming the repo owner. Requires id-token: write above.
      - name: Publish to MCP Registry
        if: hashFiles('mcp/server.json') != ''
        working-directory: mcp
        run: |
          # Install the mcp-publisher CLI from the latest GitHub release binary.
          # (The old install.sh script URL now 404s.)
          TAG=$(curl -fsSL https://api.github.com/repos/modelcontextprotocol/registry/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')
          echo "mcp-publisher $TAG"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${TAG}/mcp-publisher_linux_amd64.tar.gz" -o /tmp/mcp-publisher.tgz
          tar -xzf /tmp/mcp-publisher.tgz -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher
          /tmp/mcp-publisher login github-oidc
          # Idempotent: re-running this workflow for an already-published version
          # (the documented "npm first, then re-run" flow, or two concurrent
          # dispatches) makes the registry reject the duplicate. That is the
          # desired end state, not a failure — swallow it so the job stays green
          # and no false "all jobs failed" email goes out.
          OUT=$(/tmp/mcp-publisher publish 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -qi "duplicate version"; then
            echo "::notice::MCP Registry already has this version — nothing to do."
          elif echo "$OUT" | grep -qi "error"; then
            echo "::error::MCP Registry publish failed."
            exit 1
          fi

      # ─── Manual-refresh checklist for platforms without an API ──────────
      - name: Generate manual-refresh checklist
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## Manual refresh checklist for v${{ steps.ver.outputs.version }}

          The following platforms do NOT expose a publish API. Refresh them
          by hand within 24h of this release:

          - [ ] **Smithery** — https://smithery.ai/server/ibanforge/ibanforge → Settings → "Redeploy from npm"
          - [ ] **MCP.so** — https://mcp.so/server/ibanforge → "Refresh from GitHub"
          - [ ] **RapidAPI** — https://rapidapi.com/[your-account]/api/ibanforge → re-import OpenAPI from https://api.ibanforge.com/openapi.json
          - [ ] **DevHunt** — https://devhunt.org → Edit description + screenshots
          - [ ] **Glama** — auto-rescan within 24-48h, but you can trigger manually at https://glama.ai/mcp/servers/cammac-creator/ibanforge/admin/dockerfile → Build + Make Release
          - [ ] **Coinbase Bazaar** — auto-indexed after the next paid x402 settlement; if absent 48h after release, run scripts/bazaar-warmup.mjs to trigger a fresh settlement
          - [ ] **agentic.market** — depends on Bazaar; if Bazaar shows IBANforge but agentic.market UI lags, post in #x402 on discord.gg/cdp

          ## npm — MANUAL (npm 2FA approval gate; see RELEASING.md)

          Publish these two with Touch ID, THEN re-run this workflow so the
          MCP Registry step (which validates the npm version exists) passes:
          - [ ] \`cd mcp && npm publish --access public\` → ibanforge-mcp@${{ steps.ver.outputs.version }}
          - [ ] \`cd sdks/typescript && npm run build && npm publish --access public\` → @ibanforge/sdk@${{ steps.ver.outputs.version }}

          ## Auto-published (verify the badges turned to v${{ steps.ver.outputs.version }})

          - PyPI \`ibanforge\`: https://pypi.org/project/ibanforge/
          - MCP Registry: https://registry.modelcontextprotocol.io/v0/servers?search=ibanforge
          - npm \`ibanforge-mcp\`: https://www.npmjs.com/package/ibanforge-mcp (manual)
          - npm \`@ibanforge/sdk\`: https://www.npmjs.com/package/@ibanforge/sdk (manual)
          EOF
          echo "Checklist written to job summary."

  # ─── Optional: trigger a Glama re-scan via the API once it stabilizes ──
  # Glama doesn't expose a documented refresh endpoint yet (2026-04-29 docs).
  # When they ship one, replace the manual step above with a job here.
