name: Publish n8n-nodes-ibanforge (with provenance)

# n8n's community-node rules (since 2026-05-01) require publication through a
# GitHub Action with a provenance statement. Trigger by tagging n8n-vX.Y.Z.
#
# Prerequisite (one-time, manual): declare this repo + workflow as a trusted
# publisher for the npm package `n8n-nodes-ibanforge` (npmjs.com → package →
# Settings → Trusted publishers), or set an NPM_TOKEN secret as fallback.

on:
  push:
    tags:
      - 'n8n-v*'
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC for npm provenance
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/n8n
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: npm install

      - run: npm run build

      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
