name: Publish n8n-nodes-ibanforge (with provenance)

# n8n's community-node rules (since 2026-05-01) require publication through a
# GitHub Action with a provenance statement; a package published from a laptop
# fails `npx @n8n/scan-community-package n8n-nodes-ibanforge` on that single
# point (verified 2026-09-02 against 0.1.0). This workflow is that publication.
#
# Trigger: push a tag matching `n8n-v*` (e.g. `git tag n8n-v0.1.1 && git push
# origin n8n-v0.1.1`), or a manual `workflow_dispatch` from the Actions tab.
# It does NOT follow the `v*.*.*` tags that drive release-publish.yml: the n8n
# node carries its own version, in integrations/n8n/package.json.
#
# Auth: npm TRUSTED PUBLISHING (OIDC), no token anywhere. On npmjs.com →
# package n8n-nodes-ibanforge → Settings → Publish access → Trusted
# publishers: GitHub Actions, owner `cammac-creator`, repository `ibanforge`,
# workflow filename `n8n-publish.yml`, environment `publication`
# (RELEASING.md, step 0a). `NODE_AUTH_TOKEN` is deliberately NOT set, an empty
# token would shadow OIDC.
#
# Under control since the audit of 2026-11-10 (OPS-22, OPS-30): the job waits
# for the owner's approval in the GitHub environment `publication`; the action
# is pinned to a commit, npm to an exact version (>= 11.5.1 for trusted
# publishing; the one release-publish.yml pins), the dependency tree to the
# tracked integrations/n8n/package-lock.json, installed with `npm ci
# --ignore-scripts`; the last step refuses a version without its npm
# provenance attestation.
#
# History: dormant from 2026-09-01 (never run, infra audit OPS-19) to the day
# the scanner named the missing provenance.

on:
  push:
    tags:
      - 'n8n-v*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: publication
    permissions:
      contents: read
      id-token: write # OIDC for npm provenance + trusted publishing
    defaults:
      run:
        working-directory: integrations/n8n
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: npm with trusted publishing support (pinned)
        run: npm install -g npm@12.2.2 --ignore-scripts && npm --version

      - name: The tag and package.json must agree
        if: startsWith(github.ref, 'refs/tags/n8n-v')
        run: |
          TAG="${GITHUB_REF_NAME#n8n-v}"
          PKG="$(jq -r .version package.json)"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag n8n-v$TAG but package.json says $PKG" >&2
            exit 1
          fi

      - name: Install the locked tree, without lifecycle scripts
        run: npm ci --ignore-scripts

      - run: npm run build

      - name: Publish with provenance (trusted publishing)
        run: npm publish --access public --provenance

      # OPS-23#2: a version on npm without a provenance statement did not come
      # out of this workflow. The registry can take a few seconds to serve a
      # fresh version, hence the retries.
      - name: The published version carries a provenance attestation
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          PROVENANCE=""
          for attempt in 1 2 3 4 5 6; do
            PROVENANCE="$(npm view "n8n-nodes-ibanforge@${VERSION}" dist.attestations.provenance 2>/dev/null || true)"
            [ -n "$PROVENANCE" ] && break
            sleep 10
          done
          if [ -z "$PROVENANCE" ]; then
            echo "::error::n8n-nodes-ibanforge@${VERSION} has no npm provenance attestation"
            exit 1
          fi
          echo "n8n-nodes-ibanforge@${VERSION}: ${PROVENANCE}"
