name: Publish IBANforge.Sdk (.NET) to NuGet

# Publishes sdks/dotnet to nuget.org. Trigger: push a tag matching
# `dotnet-v*` (e.g. `git tag dotnet-v1.5.0 && git push origin dotnet-v1.5.0`),
# or a manual `workflow_dispatch`. Independent of the `v*.*.*` tags of
# release-publish.yml: the .NET SDK carries its own version in its csproj,
# which must match the tag.
#
# Auth: nuget.org TRUSTED PUBLISHING (since 2026-09-06). A policy on nuget.org
# (owner Nytril · GitHub Actions · cammac-creator/ibanforge · this file) lets
# `NuGet/login` exchange the job's OIDC token for a short-lived API key: no
# secret anywhere. `NUGET_API_KEY` stays as an optional fallback for a classic
# key. Until the policy exists, the login step fails and nothing else happens.
#
# Since the audit of 2026-11-10 (OPS-22, OPS-30) the job runs in the GitHub
# environment `publication` and waits for the owner's approval. nuget.org checks
# the environment claim only when the policy names one (GitHubTokenPolicyValidator
# in NuGet/NuGetGallery), so a policy without environment still accepts this
# job; naming `publication` in the policy binds it to the approved path
# (RELEASING.md, step 0a). Actions are pinned to a commit, their version in a
# comment, kept current by Dependabot.

on:
  push:
    tags:
      - 'dotnet-v*'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # OIDC for nuget.org trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    # Waits for the owner's approval (RELEASING.md): nothing reaches nuget.org
    # before that click.
    environment: publication
    defaults:
      run:
        working-directory: sdks/dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: The tag and the csproj must agree
        if: startsWith(github.ref, 'refs/tags/dotnet-v')
        run: |
          TAG="${GITHUB_REF_NAME#dotnet-v}"
          CSPROJ="$(grep -oE '<Version>[^<]+</Version>' src/IBANforge.Sdk/IBANforge.Sdk.csproj | sed -E 's/<\/?Version>//g')"
          if [ "$TAG" != "$CSPROJ" ]; then
            echo "tag dotnet-v$TAG but the csproj says $CSPROJ" >&2
            exit 1
          fi

      - name: Test
        run: dotnet test --nologo

      - name: Pack
        run: dotnet pack src/IBANforge.Sdk/IBANforge.Sdk.csproj -c Release -o /tmp/pkg --nologo

      # Trusted publishing: the policy on nuget.org names this repository and this
      # workflow file; the action turns the job's OIDC token into a temporary key.
      - name: Log in to nuget.org (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Nytril

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::no nuget.org key: the trusted-publishing policy is missing (nuget.org → Trusted Publishing → owner Nytril, cammac-creator/ibanforge, dotnet-publish.yml)" >&2
            exit 1
          fi
          dotnet nuget push /tmp/pkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
