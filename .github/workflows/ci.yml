name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The repository default for GITHUB_TOKEN is `write`, so a workflow with no
# permissions block hands a write token to every step. This one only reads the
# checkout: it never pushes, never tags, never comments. Narrowed 2026-09-01
# after the infra audit (OPS-04) pointed out that the five `npm ci` / `pip
# install -e` here run WITHOUT --ignore-scripts, so a compromised transitive
# dependency would execute its install script next to a token able to write to
# main. The two crons that genuinely push (refresh-bic, refresh-compliance)
# declare `contents: write` themselves and are unaffected.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # 22, matching the Dockerfile. Node 20 went end-of-life on 2026-04-30 and
      # stopped receiving security patches, so production had been sitting on an
      # unsupported runtime. 24 is not an option here: better-sqlite3 11 ships no
      # linux-x64 prebuild for ABI 137, and node:24-slim has no compiler, so the
      # image build would fail. ABI 127 (Node 22) is the newest one it prebuilds.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck
      - name: Formatting (prettier)
        run: npm run format:check
      - name: Runtime dependencies (production image)
        run: npm run deps:check

      - name: Lint
        run: npm run lint

      # Without the table the 34 official Vocalink vectors skip, and they are the
      # only thing exercising the fourteen exceptions — two of which were only
      # got right because the vectors disagreed with the prose. Non-blocking: a
      # rotted upstream link must not fail the build, it just costs coverage,
      # which the step below says out loud instead of hiding.
      - name: Fetch the UK modulus table (optional)
        run: npm run db:seed-uk || echo "::warning::UK modulus table unavailable — its 34 official vectors will SKIP in this run"

      - name: Test
        run: npm run test

      # Governance that runs. The OpenAPI document is generated from code, so
      # the only way it cannot drift from the ruleset we publish at
      # https://api.ibanforge.com/rules.yml is to regenerate and lint it here.
      - name: Lint the OpenAPI contract
        run: npm run openapi:lint

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 24, not 20, and the reason is npm rather than node. `frontend/` is the
      # only lockfile npm 10 and npm 11 disagree about: npm 11 resolves the
      # @scalar -> radix-vue chain onto @swc/helpers 0.5.15, npm 10 demands
      # 0.5.23 and refuses the tree it is handed. Node 20 ships npm 10, so
      # every push since 26/07 failed here on `npm ci` while the same command
      # succeeded on every developer machine. Node 24 ships npm 11, which is
      # what writes this lockfile and what Vercel builds the site with. It also
      # clears the EBADENGINE warnings: @scalar/* asks for node >=22.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # cache-dependency-path is REQUIRED here: `cache: npm` alone looks for
          # a lockfile at the repository root, which is the backend one, and
          # would key the cache on the wrong dependency tree.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # No typecheck script here: the frontend package.json has none.
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      # eslint exits 0 on warnings, so this gate blocks on errors only.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

  # `mcp/` is published to npm as ibanforge-mcp and had no job at all: never
  # built here, never tested. That is how a server whose every tool call
  # failed against a conformant client stayed broken for two months.
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node stays at 20 here, unlike the frontend job: this package advertises
      # `engines: node >=18`, so testing it on an old runtime is the point.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install, build & test the published MCP server
        working-directory: mcp
        run: |
          npm ci
          npm test

  sdk-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - name: Install, build & test the TypeScript SDK
        working-directory: sdks/typescript
        run: |
          npm ci
          npm run build
          npm test

  # The image that actually goes to production was never built here (OPS-10,
  # infra audit 2026-09-01). It differs from every job above in the one way that
  # matters: `npm ci --ignore-scripts` (Dockerfile), which only works because
  # better-sqlite3 13 ships a Node-API prebuild per platform. A dependency bump
  # that sends the install back through node-gyp breaks the image on a slim
  # base with no compiler — and the current discovery path for that is a failed
  # deploy on a platform whose restart policy gives up after 3 tries.
  #
  # BLOCKING since 02/09/2026. It was advisory while it proved itself; that
  # same day an image that could not boot (a runtime import of a devDependency)
  # reached Railway with a green CI and took the API down for thirteen
  # minutes. The boot check is the one gate that reads the production image.
  docker:
    runs-on: ubuntu-latest
    # Blocking since 02/09/2026: an image that does not boot is an outage for
    # a service with a volume (the previous container is stopped first), so a
    # failed boot here must stop the merge, not just decorate it.
    steps:
      - uses: actions/checkout@v7

      - name: Build the production image
        run: docker build -t ibanforge-ci .

      # A production boot refuses to start without three things, none of them
      # a real secret here: IBANFORGE_FREE_MODE (below), IP_HASH_SECRET
      # (src/lib/stats.ts refuses a well-known salt in production) and an
      # explicit CORS_ORIGIN (src/app.ts refuses a wildcard in production).
      # First run on main (2026-09-01) died on the second one.
      # IBANFORGE_FREE_MODE=true is the minimum a production boot needs:
      # ensureWalletConfigured() (src/middleware/x402.ts) throws in production
      # unless either X402_ENABLED=true + WALLET_ADDRESS, or this explicit
      # free-mode flag. Using the flag keeps the job independent of any secret,
      # so it cannot go red on a fork or on a PR from outside the repository.
      - name: Boot the container
        run: |
          docker run -d --name ibanforge-ci \
            -p 3300:3000 \
            -e NODE_ENV=production \
            -e IBANFORGE_FREE_MODE=true \
            -e IP_HASH_SECRET=ci-smoke-only-not-a-secret \
            -e CORS_ORIGIN=https://ibanforge.com \
            ibanforge-ci

      # --retry-connrefused and --retry-all-errors together: the entrypoint
      # copies two databases (36 MB) into the volume before node even starts, so
      # the first attempts hit a closed port, and /health answers 503 until the
      # databases open. Both are "not ready yet", not "broken".
      - name: Wait for /health to answer ok
        run: |
          BODY=$(curl -fsS --retry 24 --retry-delay 5 --retry-connrefused --retry-all-errors \
                   --max-time 20 http://localhost:3300/health)
          echo "$BODY"
          echo "$BODY" | grep -q '"status":"ok"'

      # Always: a failed curl above must not leave a container running on the
      # runner, and the logs are the only thing that explains a yellow job.
      - name: Container logs and teardown
        if: always()
        run: |
          docker logs ibanforge-ci 2>&1 | tail -40 || true
          docker rm -f ibanforge-ci || true

  sdk-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: sdks/java/pom.xml
      - name: Build & test the Java SDK
        working-directory: sdks/java
        run: mvn -B --no-transfer-progress test

  sdk-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build, test & pack the .NET SDK
        working-directory: sdks/dotnet
        run: |
          dotnet test --nologo
          dotnet pack src/IBANforge.Sdk/IBANforge.Sdk.csproj -c Release -o /tmp/pkg --nologo

  sdk-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install & test the Python SDK
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
          pytest -q
