name: Refresh BIC + Swiss Clearing Databases

on:
  schedule:
    # First day of each month at 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  # Lecture des jobs du run : c'est ce qui permet à l'alerte d'échec de nommer
  # l'ÉTAPE qui a cassé au lieu de dire « quelque chose a échoué ».
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Seed BIC database from GLEIF
        run: npm run db:seed

      - name: Enrich BIC database from public sources (SwiftCodes, Bundesbank, SIX, OeNB, NBP, EBA Step2)
        run: npm run bic:enrich

      - name: Enrich country names
        run: npm run db:enrich

      # Swiss clearing (SIX BankMaster) lives in the SAME data/bic.sqlite file,
      # so it is refreshed and committed here in ONE workflow rather than a
      # second cron that would race on committing the same file. The script
      # has a built-in sanity floor: if the SIX feed is truncated it aborts
      # *before* dropping ch_clearing, so the existing data stands and this
      # step fails loudly instead of committing garbage.
      - name: Seed Swiss clearing (SIX BankMaster BC-Nummer)
        run: npm run db:seed-ch

      # The German register, for the same reason as the Swiss one:
      # bank_code_check.authoritative is only honest while the register is
      # current. The seeder refuses to replace a good table with a short
      # download, so a bad month leaves the previous data standing.
      - name: Seed German Bankleitzahlen (Bundesbank)
        run: npm run db:seed-blz

      - name: Refresh Austrian, Belgian and Slovak registers
        run: npm run db:seed-national

      # The Bulgarian National Bank's BAE register. Same reason as the German
      # one: bank_code_check.authoritative is only honest while the register is
      # current, and the seeder refuses to replace a good table with a short
      # download or with one whose bank codes collapsed.
      #
      # ⚠️ Two things a reader of a red run needs to know. First, bnb.bg guards
      # the workbook endpoint with a firewall that answers a REFUSAL WITH HTTP
      # 200 and a 746-byte error page, so the seeder validates the content and
      # not the status; a policy change there shows up as "could not be
      # downloaded", never as an empty table. Second, a download failure exits 0
      # and leaves the table standing — only a FORMAT change throws, because
      # that is the one a human has to read.
      - name: Refresh the Bulgarian BAE register
        run: npm run db:seed-bg

      # Bank of England, "List of PRA-regulated Banks". Used under a written
      # permission whose condition is attribution to the Bank TOGETHER WITH the
      # month of the list, so the month has to be re-read every month — a stale
      # `list_month` is a licence breach, not a freshness bug.
      #
      # This one does NOT fail the job. The list is published a few days into
      # the month while this cron runs on the 1st, so a miss on the newest file
      # is the normal state here; the seeder walks back two months, and if
      # nothing parses it logs and exits 0 with the previous table untouched —
      # the same doctrine the Dockerfile applies to Vocalink. It never drops the
      # table before it holds a complete parse.
      - name: Refresh the Bank of England PRA List of Banks
        run: npm run db:seed-pra

      # ECB daily MFI list + Banco de España MFI list — the official identity
      # (name, LEI, registered address) behind a resolved code.
      #
      # Also does NOT fail the job, and for a sharper reason than the PRA step:
      # the ECB file exists on BUSINESS DAYS ONLY and is date-stamped in its own
      # URL, so a cron landing on a weekend or a Frankfurt holiday finds nothing
      # at the newest name. The seeder walks back four days and, if none answers,
      # leaves the table exactly as it was — dated with the day the list was
      # actually published, never with today.
      #
      # Both licences require telling buyers on EVERY access that the data is
      # free at the source, so a stale table is safe here (it keeps its own
      # date) while a wrongly dated one is not.
      - name: Refresh the ECB and Banco de España MFI lists
        run: npm run db:seed-mfi
      # EBA register of payment and e-money institutions (the PSD2 "golden
      # copy"). It belongs in THIS workflow rather than the weekly
      # refresh-compliance one for the same reason the Swiss clearing seeder
      # does: psd_entities lives in data/bic.sqlite, and refresh-compliance.yml
      # only ever stages data/compliance.sqlite. Running it there would either
      # race this job on the same file or — worse, because it fails silently —
      # seed a table that is never committed at all.
      #
      # This one does NOT fail the job either. The seeder verifies TWO SHA-256
      # digests (the ZIP against the EBA's manifest, the inflated JSON against
      # the checksum shipped inside the archive) and has a sanity floor; any of
      # them failing leaves the previous table standing and exits 0. A register
      # that is not serving today must not turn a build red.
      - name: Refresh the EBA register of payment and e-money institutions
        run: npm run db:seed-psd

      # THE GATE. GLEIF and the enrichment sources have no sanity floor of their
      # own (unlike the CH/DE/AT/BE seeders), and `npm run test` only asserts
      # `toBeGreaterThan(0)` on this table — a source answering with a truncated
      # file would commit silently, and Railway deploys on push. This step
      # compares the freshly seeded database against the one committed at HEAD
      # and refuses the commit on an abnormal delta (exit 0 = OK, non-zero =
      # refused; see the CLI contract at the top of scripts/refresh-diff.ts).
      # It runs BEFORE the test suite so a data problem is reported as a data
      # problem, not as an unrelated test failure.
      - name: Quality diff against the committed database
        run: npx tsx scripts/refresh-diff.ts

      - name: Run tests
        run: npm run test

      # The public register pages (/blz, /iid on ibanforge.com) read a JSON
      # exported from this very database through the API in-process, so a
      # refreshed register reaches the pages in the same commit.
      - name: Export register pages
        run: npm run pages:export

      - name: Export country pages
        run: npm run pages:export-countries

      # The landing page's fallback answer, re-captured on the database this
      # run just refreshed and dated, so the fold never shows a months-old
      # response again (audit 2026-09-05, n° 21).
      - name: Re-capture the landing page's fallback answer
        run: npx tsx scripts/capture-fold-response.ts

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bic.sqlite frontend/data/registers frontend/data/countries.json 'frontend/app/[locale]/playground/captured-iban.json'
          if git diff --staged --quiet; then
            echo "No changes to BIC database"
          else
            git commit -m "chore: refresh BIC + Swiss clearing databases (GLEIF, public sources, SIX BankMaster — monthly cron)"
            git pull --rebase
            git push
          fi

      # Homme mort : dire au backend que ce cron est bien passé.
      #
      # `if: success()` est le point entier — un run échoué NE DOIT PAS pointer,
      # sinon la sonde de vie confirmerait la vie d'une automatisation morte.
      #
      # ⚠️ DÉPLACÉ APRÈS LE PUSH le 2026-09-01 (audit infra, OPS-03). Il battait
      # avant le commit, et le raisonnement d'origine était bon : un push sur
      # `main` déclenche le redéploiement Railway, donc un battement placé en
      # dernier tape sur une API qui redémarre, curl échoue, et 35 jours plus
      # tard la sonde crie sur un workflow qui a parfaitement fonctionné.
      #
      # Mais ce placement laissait un trou plus grave que le faux positif qu'il
      # évitait : un `git pull --rebase` en conflit ou un push rejeté laissait
      # l'homme mort POINTÉ alors que la base n'était ni commitée ni déployée.
      # La sonde d'absence était donc désarmée précisément dans le cas où elle
      # devait parler.
      #
      # Le faux positif d'origine est traité par la fenêtre, pas par la place :
      # 10 tentatives à 30 s couvrent environ 5 minutes, largement au-dessus
      # d'un redémarrage Railway, là où les 3 tentatives à 20 s d'avant
      # couvraient à peine une minute.
      #
      # Et l'échec est maintenant BLOQUANT (`exit 1`, pas `::warning::`) : un
      # battement qui rate après 5 minutes n'est plus « le service redémarre »,
      # c'est « le service ne répond pas ». Cela fait virer le job au rouge et
      # déclenche l'étape Telegram ci-dessous, qui sait dire laquelle des deux
      # histoires raconter.
      - name: Heartbeat (après le push)
        if: success()
        env:
          HEARTBEAT_TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}
        run: |
          if [ -z "$HEARTBEAT_TOKEN" ]; then
            echo "::warning::HEARTBEAT_TOKEN absent — heartbeat non envoyé"
            exit 0
          fi
          for i in $(seq 1 10); do
            curl -fsS -X POST \
              -H "x-heartbeat-token: $HEARTBEAT_TOKEN" \
              "https://api.ibanforge.com/internal/heartbeat/refresh-bic" && exit 0
            echo "tentative $i/10 sans réponse — l'API redémarre peut-être après le push"
            sleep 30
          done
          echo "::error::heartbeat KO après 10 tentatives sur environ 5 minutes — l'API ne répond pas"
          exit 1

      # Failure notification. GitHub's default only emails whoever last edited
      # the cron, and it is individually disableable: refresh-bic failed on
      # 2026-05-01 AND 2026-06-01 with nobody acting for two months. The same
      # secrets are already used by weekly-veille.yml.
      #
      # This is the "it failed" half. The "it never ran" half — which no failure
      # notification can ever cover — is the Heartbeat step above.
      - name: Tell Telegram if anything above failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::secrets Telegram absents — alerte non envoyée"
            exit 0
          fi
          # Nommer l'étape qui a cassé : sans elle l'alerte dit « quelque chose
          # a échoué » et il faut ouvrir le run pour savoir quoi. Best-effort —
          # si l'API refuse, on envoie le reste plutôt que rien.
          # `gh api` écrit son corps d'erreur sur STDOUT : sans le `if`, un 404
          # ou un jeton sans droit `actions: read` collerait une blob JSON dans
          # le message d'alerte au lieu du nom de l'étape.
          STEP=""
          if RAW=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
                     --jq '.jobs[].steps[] | select(.conclusion=="failure") | .name' 2>/dev/null); then
            STEP=$(printf '%s' "$RAW" | head -3 | paste -sd, -)
          fi
          [ -z "$STEP" ] && STEP="(étape inconnue — voir le run)"
          # Depuis que le battement est passé APRÈS le push (OPS-03), une seule
          # phrase de conséquence mentirait : quand c'est le battement qui rate,
          # la base A ÉTÉ rafraîchie et poussée, et le vrai sujet est l'API.
          CONSEQ="la base BIC N’A PAS été rafraîchie ; la version précédente reste servie."
          case "$STEP" in
            *Heartbeat*) CONSEQ="la base BIC a bien été rafraîchie ET poussée, mais l’API n’a pas répondu au battement en 5 minutes — vérifier que le service est debout." ;;
          esac
          MSG=$(printf '%s\nÉtape : %s\nConséquence : %s\n%s' \
                  "🔴 IBANforge — le workflow « ${GITHUB_WORKFLOW} » a ÉCHOUÉ" "$STEP" "$CONSEQ" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" >/dev/null
