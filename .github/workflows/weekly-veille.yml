name: Weekly market-watch (veille) → Dory

on:
  schedule:
    # Mondays ~08:23 Europe/Zurich (06:23 UTC). Off-minute on purpose so the
    # job doesn't land on the same instant as every other :00 cron on GitHub.
    - cron: '23 6 * * 1'
  workflow_dispatch: {} # manual trigger for testing

permissions:
  contents: read
  # Lecture des jobs du run : c'est ce qui permet à l'alerte d'échec de nommer
  # l'ÉTAPE qui a cassé au lieu de dire « quelque chose a échoué ».
  actions: read

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run weekly veille and push the report to Dory
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run veille

      # Homme mort : dire au backend que ce cron est bien passé.
      #
      # C'est LE battement qui compte le plus : le canari de découvrabilité
      # (scripts/discoverability-canary.ts), seule sonde de régression du 402
      # universel, ne s'exécute qu'à l'intérieur de cette veille. Si la veille
      # meurt, le canari meurt avec elle — et un lundi sans rapport ressemble
      # exactement à un lundi sans rapport.
      #
      # `if: success()` est le point entier : un run échoué NE DOIT PAS pointer.
      - name: Heartbeat
        if: success()
        env:
          HEARTBEAT_TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}
        run: |
          if [ -z "$HEARTBEAT_TOKEN" ]; then
            echo "::warning::HEARTBEAT_TOKEN absent — heartbeat non envoyé"
            exit 0
          fi
          for i in 1 2 3; do
            curl -fsS -X POST \
              -H "x-heartbeat-token: $HEARTBEAT_TOKEN" \
              "https://api.ibanforge.com/internal/heartbeat/weekly-veille" && exit 0
            sleep 20
          done
          echo "::warning::heartbeat KO après 3 tentatives (non bloquant)"

      # Failure notification. Ce job ne parlait QUE lorsqu'il réussissait :
      # clé Anthropic expirée, STATS_TOKEN rotaté sans être reposé, quota
      # atteint — il ne se passait rien du tout. Les secrets Telegram sont ceux
      # que le job utilise déjà juste au-dessus.
      - name: Tell Telegram if anything above failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::secrets Telegram absents — alerte non envoyée"
            exit 0
          fi
          # `gh api` écrit son corps d'erreur sur STDOUT : sans le `if`, un 404
          # ou un jeton sans droit `actions: read` collerait une blob JSON dans
          # le message d'alerte au lieu du nom de l'étape.
          STEP=""
          if RAW=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
                     --jq '.jobs[].steps[] | select(.conclusion=="failure") | .name' 2>/dev/null); then
            STEP=$(printf '%s' "$RAW" | head -3 | paste -sd, -)
          fi
          [ -z "$STEP" ] && STEP="(étape inconnue — voir le run)"
          MSG=$(printf '%s\nÉtape : %s\nConséquence : pas de rapport de veille cette semaine — et le canari de découvrabilité n’a pas tourné non plus.\n%s' \
                  "🔴 IBANforge — le workflow « ${GITHUB_WORKFLOW} » a ÉCHOUÉ" "$STEP" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" >/dev/null
