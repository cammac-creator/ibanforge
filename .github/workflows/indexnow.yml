name: IndexNow (Bing and friends)

# Every Monday, and by hand after a batch of new pages: submit the whole live
# sitemap to IndexNow so Bing, DuckDuckGo, Yandex, Seznam, Naver and the
# Internet Archive look at the register and country pages without waiting for
# a crawl. Google ignores IndexNow and reads sitemap.xml on its own schedule.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The job reads the repository (checkout) and calls outside services with its
# own secret. It writes nothing to GitHub, so the token gets read access only.
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Submit the live sitemap
        run: node scripts/indexnow-ping.mjs --sitemap

      # Homme mort : dire à l'API que ce cron est passé (src/lib/ops-alert.ts,
      # HEARTBEATS). Rien n'est poussé ici :
      # le battement part après l'envoi du plan du site.
      - name: Heartbeat
        if: success()
        env:
          HEARTBEAT_TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}
        run: |
          if [ -z "$HEARTBEAT_TOKEN" ]; then
            echo "::warning::HEARTBEAT_TOKEN absent, battement non envoyé"
            exit 0
          fi
          for i in 1 2 3; do
            curl -fsS -X POST \
              -H "x-heartbeat-token: $HEARTBEAT_TOKEN" \
              "https://api.ibanforge.com/internal/heartbeat/indexnow" && exit 0
            sleep 20
          done
          echo "::warning::battement KO après 3 tentatives (non bloquant)"
