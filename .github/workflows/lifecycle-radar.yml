name: Lifecycle radar (API keys) → Dory

on:
  schedule:
    # Daily at 05:30 UTC.
    - cron: '30 5 * * *'
  workflow_dispatch: {} # manual trigger for testing

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Anti-repetition state. A unique key per run always writes a fresh cache
      # entry; restore-keys pulls the most recent previous one. State is NEVER
      # committed to the repo (a daily commit would trigger a needless Railway
      # redeploy).
      - name: Restore radar state
        uses: actions/cache@v4
        with:
          path: .radar-state
          key: lifecycle-radar-state-${{ github.run_id }}
          restore-keys: |
            lifecycle-radar-state-

      - name: Run lifecycle radar and alert Dory on new events
        env:
          IBANFORGE_API_BASE: https://api.ibanforge.com
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          TELEGRAM_DORY_TOKEN: ${{ secrets.TELEGRAM_DORY_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_STATE_DIR: .radar-state
        run: npx tsx scripts/lifecycle-radar.ts
