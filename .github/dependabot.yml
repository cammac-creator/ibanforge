version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 6 breaks the typescript-eslint peer range (CI red since
      # 2026-07-13); lift when typescript-eslint supports TS 6.
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
    groups:
      x402:
        patterns:
          - "@x402/*"
          - "@coinbase/x402"
          - "@coinbase/cdp-sdk"
      mcp:
        patterns:
          - "@modelcontextprotocol/*"
      hono:
        patterns:
          - "hono"
          - "@hono/*"
      dev-tooling:
        patterns:
          - "vitest"
          - "typescript"
          - "@types/*"
          - "eslint"
          - "@typescript-eslint/*"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    # Raised from 5 to 10 on 2026-09-01 (infra audit, OPS-06). The ceiling was
    # ATTAINED: five frontend PRs were open, so Dependabot had stopped opening
    # new ones entirely — including any security update. A ceiling that is
    # reached silently stops being a rate limit and becomes an off switch.
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
    groups:
      next:
        patterns:
          - "next"
          - "next-intl"
          - "next-themes"
          - "next-mdx-remote"
      tooling:
        patterns:
          - "typescript"
          - "@types/*"
          - "eslint*"
          - "tailwindcss"
    commit-message:
      prefix: "chore(deps,frontend)"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
    commit-message:
      prefix: "chore(deps,mcp)"
      include: "scope"

  # The three PUBLISHED artefacts that received no dependency update at all
  # until 2026-09-01 (infra audit, OPS-06). Publishing a package to npm or PyPI
  # and leaving its tree unwatched is worse than not watching an internal
  # directory: the vulnerability ships to whoever installs it.

  # npm @ibanforge/sdk
  - package-ecosystem: "npm"
    directory: "/sdks/typescript"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
    groups:
      dev-tooling:
        patterns:
          - "vitest"
          - "typescript"
          - "@types/*"
          - "eslint"
          - "@typescript-eslint/*"
    commit-message:
      prefix: "chore(deps,sdk-ts)"
      include: "scope"

  # npm n8n-nodes-ibanforge. No lockfile here (n8n-publish.yml runs `npm
  # install`, not `npm ci`), which Dependabot handles: it updates package.json
  # alone. Both dependencies are dev-only, hence the single group.
  - package-ecosystem: "npm"
    directory: "/integrations/n8n"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
    groups:
      dev-tooling:
        patterns:
          - "typescript"
          - "@types/*"
          - "n8n-workflow"
    commit-message:
      prefix: "chore(deps,n8n)"
      include: "scope"

  # PyPI ibanforge. Read from sdks/python/pyproject.toml; the runtime tree is a
  # single dependency (httpx), the rest is test tooling.
  - package-ecosystem: "pip"
    directory: "/sdks/python"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      test-tooling:
        patterns:
          - "pytest*"
          - "respx"
    commit-message:
      prefix: "chore(deps,sdk-py)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
